server {
    # www auf non-www umleiten, dauerhaft (301).
    # Traefik terminiert TLS und reicht den urspruenglichen Host-Header durch,
    # deshalb enthaelt $host hier wirklich "www.mein-traumheld.de".
    # $request_uri haengt Pfad und Query-String unveraendert an.
    if ($host = www.mein-traumheld.de) {
        return 301 https://mein-traumheld.de$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }
    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
